# Build and test on Linux, Windows and macOS, and keep each one's starcanopy.
# The bake tests need OpenGL 3.3 and CI machines have no GPU: Linux uses Mesa's
# software renderer through EGL; Windows gets Mesa's software OpenGL installed
# beside them; on macOS they need the runner to give a context, which is
# unproven.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Windows and macOS are unproven: this flag holds the door open while they
    # earn their place, and is taken off each as it does -- never used to make
    # a real breakage look green.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            experimental: false
          - name: Windows (unproven)
            os: windows-latest
            experimental: true
          - name: macOS (unproven)
            os: macos-latest
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libegl-dev libgl-dev libegl-mesa0 libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libdrm-dev libgbm-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release -j 4

      # Mesa's software OpenGL for Windows, beside every executable -- the tests and
      # starcanopy, which the cli test runs -- so they have a 3.3 context on a runner
      # with no GPU.
      - name: Install Mesa's software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.3/mesa3d-26.2.3-release-msvc.7z"
          Invoke-WebRequest $url -OutFile mesa.7z
          7z x mesa.7z -omesa | Out-Null
          Get-ChildItem build -Recurse -Filter "*.exe" | ForEach-Object {
            Copy-Item mesa/x64/*.dll $_.DirectoryName
          }

      - name: Test
        env:
          GALLIUM_DRIVER: llvmpipe
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Strip (Linux)
        if: runner.os == 'Linux'
        run: strip --strip-unneeded build/starcanopy

      - name: Upload starcanopy
        uses: actions/upload-artifact@v4
        with:
          name: starcanopy-${{ runner.os }}
          if-no-files-found: warn
          path: |
            build/starcanopy
            build/Release/starcanopy.exe
            build/starcanopy.exe
