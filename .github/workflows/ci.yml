# Build and test on Linux. The bake tests run headless on Mesa's software
# renderer through EGL; the hidden-window test skips, there being no display.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libegl-dev libgl-dev libegl-mesa0 libgl1-mesa-dri \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libdrm-dev libgbm-dev

      - name: Configure
        run: cmake -B build -G Ninja

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure
